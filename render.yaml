
services:
  - type: web
    name: agvia-backend
    runtime: docker
    plan: starter
    branch: main

    rootDir: "AGVIA - BACKEND"
    dockerfilePath: "./Dockerfile"

    autoDeployTrigger: commit
    healthCheckPath: /api/health

    envVars:
      - key: PORT
        value: "8080"

      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx512m"

      - key: SPRING_PROFILES_ACTIVE
        value: "prod"

      - key: DB_HOST
        value: "mysql-2b47628b-agvia-123.k.aivencloud.com"

      - key: DB_PORT
        value: "11088"

      - key: DB_NAME
        value: "defaultdb"

      - key: DB_USER
        value: "avnadmin"

      - key: DB_USERNAME
        value: "avnadmin"

      - key: DB_PASSWORD
        sync: false

      - key: DB_URL
        value: "jdbc:mysql://mysql-2b47628b-agvia-123.k.aivencloud.com:11088/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=UTC"

      - key: DDL_AUTO
        value: "update"

      - key: JWT_SECRET
        sync: false

      - key: JWT_EXPIRATION_MS
        value: "86400000"

      - key: RAZORPAY_KEY_ID
        sync: false

      - key: RAZORPAY_KEY_SECRET
        sync: false

      - key: CORS_ALLOWED_ORIGINS
        value: "https://agvia-ecommerce.vercel.app,https://agvia.vercel.app,http://localhost:5173,http://localhost:3000"

      - key: FRONTEND_URL
        value: "https://agvia-ecommerce.vercel.app"

      - key: DEFAULT_ADMIN_EMAIL
        value: "admin@agvia.com"

      - key: DEFAULT_ADMIN_PASSWORD
        sync: false

      - key: DEFAULT_ADMIN_NAME
        value: "AGVIA Administrator"
