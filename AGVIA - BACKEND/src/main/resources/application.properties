# ==========================================
# EMAIL CONFIGURATION (Gmail SMTP)
# HOW TO ENABLE LIVE EMAILS:
#   1. Go to https://myaccount.google.com/apppasswords
#   2. Generate a 16-character App Password for "Mail"
#   3. Set MAIL_PASSWORD below to that 16-char code (no spaces)
#   4. Restart the backend server
# ==========================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM:venkatbodduluri78@gmail.com}
app.mail.enabled=${MAIL_ENABLED:true}
app.mail.store-notification-email=${STORE_NOTIFICATION_EMAIL:venkatbodduluri78@gmail.com}
app.mail.admin-email=${AGVIA_ADMIN_EMAIL:admin@agvia.com}
app.mail.support-email=${AGVIA_SUPPORT_EMAIL:support@agvia.com}
app.mail.retry.enabled=${MAIL_RETRY_ENABLED:true}
app.mail.retry.max-attempts=${MAIL_RETRY_MAX_ATTEMPTS:3}
app.mail.retry.fixed-delay-ms=${MAIL_RETRY_DELAY_MS:300000}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ==========================================
# CORS
# ==========================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,https://agvia.vercel.app}

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# ==========================================
# ACTUATOR & HEALTH MONITORING
# ==========================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.info.env.enabled=true

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.ems.pragathisweets=DEBUG

# ==========================================
# INVENTORY
# ==========================================
app.inventory.low-stock-threshold=${LOW_STOCK_THRESHOLD:10}

# ==========================================
# ADMIN BOOTSTRAP (creates a default admin user on first run if none exists)
# ==========================================
app.admin.default-email=${DEFAULT_ADMIN_EMAIL:admin@agvia.com}
app.admin.default-password=${DEFAULT_ADMIN_PASSWORD:agvia@123}
app.admin.default-name=${DEFAULT_ADMIN_NAME:AGVIA Administrator}

