# ==========================================
# PRAGATHI SWEETS - PRODUCTION CONFIGURATION
# Activate with: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==========================================

# Database schema safety in production - can update or validate based on DDL_AUTO
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Strict production logging
logging.level.root=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=ERROR
logging.level.com.ems.pragathisweets=INFO

# Swagger disabled in prod unless explicitly enabled
springdoc.api-docs.enabled=${ENABLE_SWAGGER:false}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:false}

# Actuator health details hidden in production
management.endpoint.health.show-details=never

